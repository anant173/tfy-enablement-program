type: service
name: simple-calculator-mcp
image:
  type: build
  build_source:
    type: git
    branch_name: main
    ref: 042ceed23fa9073aec0e15986e4cd98c75c8061a
    repo_url: https://github.com/anant173/tfy-enablement-program
  build_spec:
    type: tfy-python-buildpack
    build_context_path: ./deploy-mcp-server/simple-calculator-mcp
    command: python main.py
    python_version: '3.11'
    python_dependencies:
      type: pip
      requirements_path: requirements.txt
ports:
  - expose: true
    port: 8000
    protocol: TCP
    app_protocol: http
    host: simple-calculator-mcp-anant-ws-8000.tfy-usea1-ctl.devtest.truefoundry.tech
workspace_fqn: tfy-usea1-devtest:anant-ws
replicas: 1
allow_interception: false
resources:
  node:
    type: node_selector
    capacity_type: spot_fallback_on_demand
  cpu_request: 0.2
  cpu_limit: 0.5
  memory_request: 200
  memory_limit: 500
  ephemeral_storage_request: 1000
  ephemeral_storage_limit: 2000
