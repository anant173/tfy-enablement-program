name: simple-calculator-mcp
type: service
image:
  type: build
  build_source:
    type: git
    repo_url: https://github.com/anant173/tfy-enablement-program
    ref: 95c1f5d5bcad23289feeed3df0ca989724e0ea0f
  build_spec:
    type: dockerfile
    dockerfile_path: deploy-mcp-server/simple-calculator-mcp/Dockerfile
    build_context_path: deploy-mcp-server/simple-calculator-mcp
ports:
  - port: 8000
    expose: true
    host: simple-calculator-mcp.tfy-usea1-ctl.devtest.truefoundry.tech
    path: /
    protocol: TCP
replicas: 1
resources:
  cpu_request: 0.1
  cpu_limit: 0.5
  memory_request: 128
  memory_limit: 512
  ephemeral_storage_request: 128
  ephemeral_storage_limit: 512
liveness_probe:
  config:
    type: http
    path: /health
    port: 8000
  initial_delay_seconds: 10
  period_seconds: 30
readiness_probe:
  config:
    type: http
    path: /health
    port: 8000
  initial_delay_seconds: 10
  period_seconds: 10
workspace_fqn: tfy-usea1-devtest:anant-ws
